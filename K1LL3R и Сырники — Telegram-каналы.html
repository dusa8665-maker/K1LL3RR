<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Два Telegram-канала: K1LL3R и Сырники</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600&display=swap">
<style>
:root{
  --ghost-bg:#1c1a30; --ghost-ink:#e9e4ff; --ghost-accent:#a58bff;
  --cheese-bg:#ffd95e; --cheese-ink:#3b2a00; --cheese-accent:#fff3c4;
  --head:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);background:var(--ghost-bg);min-height:100vh}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.panel{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,64px);gap:48px;min-width:0}
.ghost{background:var(--ghost-bg);color:var(--ghost-ink)}
.cheese{background:var(--cheese-bg);color:var(--cheese-ink)}
.badge{font-size:clamp(64px,10vw,120px);line-height:1}
h2{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,76px);line-height:1;margin:16px 0 0;letter-spacing:-.02em;overflow-wrap:anywhere}
.ghost h2{animation:float 5s ease-in-out infinite}
p{font-size:clamp(16px,1.6vw,19px);line-height:1.55;max-width:34ch;margin:20px 0 0}
.handle{font-weight:600;opacity:.75;margin-top:12px}
.btn{display:inline-block;font-family:var(--head);font-weight:600;font-size:15px;text-decoration:none;padding:18px 28px;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-3px)}
.btn:focus-visible{outline:3px solid currentColor;outline-offset:4px}
.ghost .btn{background:var(--ghost-accent);color:#1c1a30}
.cheese .btn{background:var(--cheese-ink);color:var(--cheese-accent)}
@keyframes float{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.ghost h2{animation:none}.btn{transition:none}}
@media (max-width:760px){.split{grid-template-columns:1fr}.panel{min-height:60vh}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cheese-bg:#e8bd32}}
</style>
</head>
<body>
<main class="split">
  <section class="panel ghost">
    <div>
      <div class="badge" aria-hidden="true">👻</div>
      <h2>K1LL3R</h2>
      <p>Telegram-канал автора K1LL3R. Заходите, смотрите и подписывайтесь.</p>
      <div class="handle">@K1LL3Rqq</div>
    </div>
    <div><a class="btn" href="https://t.me/K1LL3Rqq" target="_blank" rel="noopener">Открыть канал</a></div>
  </section>
  <section class="panel cheese">
    <div>
      <div class="badge" aria-hidden="true">🧀</div>
      <h2>Сырники</h2>
      <p>Telegram-канал «Сырники». Загляните, вам понравится.</p>
      <div class="handle">@CbIPHbIKN</div>
    </div>
    <div><a class="btn" href="https://t.me/CbIPHbIKN" target="_blank" rel="noopener">Открыть канал</a></div>
  </section>
</main>
</body>
</html>
